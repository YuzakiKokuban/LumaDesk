[package]
name = "jiyaochu"
version = "0.2.0-beta.3"
edition = "2021"
rust-version = "1.92"
description = "机耀处 — Mechrevo laptop control center, optimized for 耀世 15 Air"
license = "MIT"
build = "build.rs"

# The hardware/configuration core is a plain library. The WinUI 3 front end is
# C# and loads this as a DLL across a C ABI, so the crate is a `cdylib`; the
# `rlib` half exists so `jiyaochu-ctl` (and the unit tests) can link it directly.
[lib]
name = "jiyaochu_core"
crate-type = ["cdylib", "rlib"]

# A headless front end over the exact same ABI the C# app uses. It is the way to
# exercise the backend on a machine with no UI, and the way to tell a backend
# bug apart from a front-end bug.
[[bin]]
name = "jiyaochu-ctl"
path = "src/bin/jiyaochu-ctl.rs"

# No WebView, no JS runtime, no bundler: one native DLL and one console tool.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
dirs = "7"

[target.'cfg(windows)'.dependencies]
# Only the Win32 surface the core actually calls. Everything Direct2D /
# DirectWrite / DWM / HiDpi belonged to the archived self-drawn UI and is gone,
# which keeps the DLL small.
windows = { version = "0.61", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    # The power-scheme API (`PowerEnumerate`, `PowerGetActiveScheme`, …) is
    # gated behind the registry feature in windows-rs.
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_WindowsProgramming",
    "Win32_UI_ColorSystem",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# A Rust panic must never unwind into the C# caller's stack.
panic = "abort"
strip = true
