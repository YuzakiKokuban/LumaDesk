name: Build and verify

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  audit:
    uses: ./.github/workflows/dependency-audit.yml
  package:
    needs: checks
    uses: ./.github/workflows/build.yml
  windows:
    # Keep the existing required branch-protection context.
    name: Windows x64
    if: always()
    needs: [checks, audit, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not pass: ' + ', '.join(failed))
          PY
  telegram:
    # PRs and main cache builds never receive notification credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: windows
    uses: ./.github/workflows/telegram.yml
    with:
      channel: dev
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
