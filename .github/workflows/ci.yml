name: Build and release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      JIYAOCHU_FORCE_MOCK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Configure test environment
        run: '"JIYAOCHU_DATA_DIR=$env:RUNNER_TEMP\LumaDesk-test-config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: app/packages.*.lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ hashFiles('src/**/*.rs', 'build.rs') }}
          restore-keys: |
            windows-rust-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Rust checks
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --all-targets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked
          exit $LASTEXITCODE
      - name: Protocol tests
        run: python -m unittest discover -s reverse/native -p 'test_*.py'
      - name: Release policy tests
        run: python scripts/verify-release-policy.py
      - name: Source identity check
        run: python scripts/verify-source.py
      - name: Install shared WinUI runtime for application tests
        run: |
          Invoke-WebRequest 'https://aka.ms/windowsappsdk/2.5/2.5.1/windowsappruntimeinstall-x64.exe' -OutFile "$env:RUNNER_TEMP\WinUI-runtime.exe"
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP\WinUI-runtime.exe"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'WinUI runtime publisher verification failed' }
          $runtime = Start-Process "$env:RUNNER_TEMP\WinUI-runtime.exe" -ArgumentList '--quiet' -WindowStyle Hidden -Wait -PassThru
          if ($runtime.ExitCode -ne 0) { throw "Runtime installation failed: $($runtime.ExitCode)" }
      - name: Restore and build WinUI
        run: |
          dotnet restore app/JiYaoChu.csproj --locked-mode -p:Configuration=Debug
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build app/JiYaoChu.csproj -c Debug --no-restore -warnaserror
          exit $LASTEXITCODE
      - name: Restore release dependencies
        run: dotnet restore app/JiYaoChu.csproj --locked-mode -p:Configuration=Release
      - name: Build portable and installer packages
        run: ./scripts/build.ps1 -NoRestore
      - name: Verify package
        run: python scripts/verify-package.py --archive (Get-ChildItem artifacts/LumaDesk-*-win-x64.zip).FullName
      - name: Verify installer dependency detection
        run: python scripts/verify-installer-dependencies.py
      - name: Verify event-driven system OSD
        run: ./scripts/verify-system-osd.ps1 -SkipNativeAudio
      - name: Verify background login task migration
        run: python scripts/verify-autostart-migration.py
      - name: Verify installation and uninstallation
        run: ./scripts/verify-installer.ps1 -Installer (Get-ChildItem artifacts/LumaDesk-*-Setup.exe).FullName -Directory "$env:RUNNER_TEMP\LumaDesk-installed"
      - uses: actions/upload-artifact@v7
        with:
          name: LumaDesk-win-x64
          path: |
            artifacts/LumaDesk-*-win-x64.zip
            artifacts/LumaDesk-*-win-x64.zip.sha256
            artifacts/LumaDesk-*-win-x64-Setup.exe
            artifacts/LumaDesk-*-win-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/verify-release.ps1 -Tag $env:RELEASE_TAG
      - name: Download verified package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match package version' }
          gh run download $env:RUN_ID -n LumaDesk-win-x64 -D release-files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $assets = (Get-ChildItem release-files -File).FullName
          $releaseArgs = @('release','create',$env:RELEASE_TAG) + $assets + @('--verify-tag','--notes-file',"docs/releases/$version.md",'--title',"LumaDesk $version")
          if ($version.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          exit $LASTEXITCODE
