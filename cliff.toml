[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}`{{ commit.scope }}` {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}

{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_preprocessors = [{ pattern = "\\s*\\[skip ci\\]", replace = "" }]
commit_parsers = [
  { message = "^chore\\(release\\):", skip = true },
  { message = "^feat(\\(.+\\))?:", group = "新增" },
  { message = "^fix(\\(.+\\))?:", group = "修复" },
  { message = "^docs(\\(.+\\))?:", group = "文档" },
  { message = "^test(\\(.+\\))?:", group = "测试" },
  { message = "^(ci|build)(\\(.+\\))?:", group = "构建与发布" },
  { message = ".*", group = "其他" },
]
